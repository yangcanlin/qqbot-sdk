name: Bug 反馈
description: SDK 运行异常、接口报错、事件丢失等问题反馈
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先阅读 [README](https://gitee.com/meilinkj/qqbot-sdk#仓库与反馈) 与 [官方开发文档](https://bot.q.qq.com/wiki/develop/api-v2/)，并搜索现有 Issue 避免重复。
        **请勿在 Issue 中粘贴 AppSecret、AccessToken 等任何凭证。**
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issues，确认没有重复问题
          required: true
        - label: 我未包含任何密钥、Token 等敏感信息
          required: true
  - type: input
    id: sdk-version
    attributes:
      label: SDK 版本
      description: 例如 1.0.0（Maven 坐标 cn.meilinkj.qqbot:qqbot-sdk-api）
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - qqbot-sdk-core（鉴权 / HTTP / 网关 / 事件）
        - qqbot-sdk-api（群聊 / 单聊 / 频道 / 互动接口）
        - qqbot-sdk-spring-boot-starter（Spring Boot 装配）
        - qqbot-sdk-example（示例）
        - 其他 / 不确定
    validations:
      required: true
  - type: dropdown
    id: scene
    attributes:
      label: 使用场景
      options:
        - QQ 群聊（V2）
        - 单聊 C2C（V2）
        - QQ 频道（Guild）
        - WebSocket 网关连接 / 重连
        - 富媒体上传
        - 其他
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供最小可复现代码片段（用 ``` 包裹）与操作步骤
      placeholder: |
        1. 配置 ...
        2. 调用 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 异常堆栈、错误码、日志等（注意脱敏）
    validations:
      required: true
  - type: input
    id: trace-id
    attributes:
      label: trace_id（如为平台接口报错）
      description: HTTP 响应头 X-Tps-trace-ID 或响应体 trace_id，便于向 QQ 开放平台排查
  - type: textarea
    id: env
    attributes:
      label: 运行环境
      description: JDK 版本、操作系统、Spring Boot 版本（如使用 Starter）、网络环境等
      placeholder: "JDK 17 / macOS 15 / Spring Boot 3.3.5"
    validations:
      required: true